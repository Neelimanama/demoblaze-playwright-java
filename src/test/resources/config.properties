# Default settings. Every key can be overridden with a JVM system property (-Dkey=value)
# or an environment variable (upper-case, dots -> underscores, e.g. BASE_URL, HEADLESS).
base.url=https://www.demoblaze.com
# chromium | firefox | webkit
browser=chromium
headless=false
slow.mo=0
# Default Playwright timeout for actions / auto-waiting assertions
timeout.ms=15000
viewport.width=1366
viewport.height=900
# Playwright trace capture: off | on | on-failure
trace=on
